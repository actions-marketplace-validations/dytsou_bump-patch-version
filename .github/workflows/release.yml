name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (e.g. v0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: GitHub Release
        uses: dytsou/release/github@bd0a18d5c09de51824b5d4917401021c43167caa # v1.0.0 (@v1)
        with:
          tag: ${{ inputs.tag }}
          body: |
            ## Bump Patch Version __TAG__

            Bump the **patch** version in `package.json` and open a pull request.

            Callers must checkout first (`fetch-depth: 0`, `fetch-tags: true`). This Action does not checkout.

            ### Usage

            ```yaml
            # .github/workflows/bump-patch-version.yml
            name: Bump patch version

            on:
              workflow_dispatch:

            permissions:
              contents: read

            jobs:
              bumpPatchVersion:
                runs-on: ubuntu-latest
                permissions:
                  contents: write
                  pull-requests: write
                steps:
                  - uses: actions/checkout@v7
                    with:
                      fetch-depth: 0
                      fetch-tags: true

                  - uses: dytsou/bump-patch-version@__MAJOR__
            ```

            Pin the major tag (`@__MAJOR__`) for floating updates within this major, or pin `@__TAG__` for a fixed release. Prefer a commit SHA in production.

            ### Inputs

            | Name | Default | Description |
            | ---- | ------- | ----------- |
            | `package-json-path` | `package.json` | Path relative to workspace |
            | `base-branch` | `main` | Tag-ahead check + PR base |
            | `labels` | `ci, maintenance` | PR labels |
            | `token` | `github.token` | Token for create-pull-request |

            ### Notes

            - Bump edits `package.json` only (no npm lifecycle scripts, no lockfile updates).
            - Fails if the base branch has no commits after the latest merged tag (continues when there are no tags yet).
            - Docs: [README](https://github.com/dytsou/bump-patch-version#readme) · [繁體中文](https://github.com/dytsou/bump-patch-version/blob/main/README-zh.md)
