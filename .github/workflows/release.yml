name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (e.g. v0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "error: tag must look like v1.2.3 (got: $TAG)" >&2
            exit 1
          fi
          MAJOR="${TAG%%.*}" # v1.2.3 → v1
          PRERELEASE=false
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE=true
          fi
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"
          echo "major=$MAJOR" >>"$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >>"$GITHUB_OUTPUT"
          echo "Resolved tag=$TAG major=$MAJOR prerelease=$PRERELEASE"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
          draft: false
          generate_release_notes: true
          body: |
            ## Bump Patch Version ${{ steps.tag.outputs.tag }}

            Bump the **patch** version in `package.json` and open a pull request.

            Callers must checkout first (`fetch-depth: 0`, `fetch-tags: true`). This Action does not checkout.

            ### Usage

            ```yaml
            # .github/workflows/bump-patch-version.yml
            name: Bump patch version

            on:
              workflow_dispatch:

            permissions:
              contents: read

            jobs:
              bumpPatchVersion:
                runs-on: ubuntu-latest
                permissions:
                  contents: write
                  pull-requests: write
                steps:
                  - uses: actions/checkout@v7
                    with:
                      fetch-depth: 0
                      fetch-tags: true

                  - uses: dytsou/bump-patch-version@${{ steps.tag.outputs.major }}
            ```

            Pin the major tag (`@${{ steps.tag.outputs.major }}`) for floating updates within this major, or pin `@${{ steps.tag.outputs.tag }}` for a fixed release. Prefer a commit SHA in production.

            ### Inputs

            | Name | Default | Description |
            | ---- | ------- | ----------- |
            | `package-json-path` | `package.json` | Path relative to workspace |
            | `base-branch` | `main` | Tag-ahead check + PR base |
            | `labels` | `ci, maintenance` | PR labels |
            | `token` | `github.token` | Token for create-pull-request |

            ### Notes

            - Bump edits `package.json` only (no npm lifecycle scripts, no lockfile updates).
            - Fails if the base branch has no commits after the latest merged tag (continues when there are no tags yet).
            - Docs: [README](https://github.com/dytsou/bump-patch-version#readme) · [繁體中文](https://github.com/dytsou/bump-patch-version/blob/main/README-zh.md)

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Move major version tag
        if: steps.tag.outputs.prerelease != 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          MAJOR="${{ steps.tag.outputs.major }}"
          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}"
          git tag -f "$MAJOR" "$TAG"
          git push -f origin "refs/tags/${MAJOR}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
